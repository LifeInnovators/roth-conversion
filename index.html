<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roth Conversion Calculator — TAE (Local Test)</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">

  <!-- React 18 -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel (transpiles JSX in the browser — test only, not for production) -->
  <!-- Pinned to last 7.x: unpinned URL now serves Babel 8, which breaks this Babel-7-era JSX. -->
  <script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>

  <!-- Chart.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

  <style>
    html, body { margin: 0; padding: 0; }
    /* White body prevents grey bleed below calculator in WP iframe */
    body { background: #ffffff; }
    /* No min-height on #root — iframe height is driven by content via postMessage */
    #root { }
    /* Loading indicator while Babel compiles */
    #loading { font-family: system-ui; font-size: 14px; color: #888; padding: 2rem; text-align: center; }
  </style>
</head>
<body>
  <div id="loading">Loading calculator…</div>
  <div id="root"></div>

  <script type="text/babel">
    // ─── React hooks (from CDN global) ────────────────────────────────────────
    const { useState, useEffect, useRef, useMemo, memo } = React;
    // Chart is already a global from the Chart.js CDN script above.

    // ─── constants ────────────────────────────────────────────────────────────
    const RMD_FACTORS = {
      73:26.5, 74:25.5, 75:24.6, 76:23.7, 77:22.9, 78:22.0, 79:21.1, 80:20.2,
      81:19.4, 82:18.5, 83:17.7, 84:16.8, 85:16.0, 86:15.2, 87:14.4, 88:13.7,
      89:12.9, 90:12.2, 91:11.5, 92:10.8, 93:10.1, 94:9.5,  95:8.9,  96:8.4,
      97:7.8,  98:7.3,  99:6.8,  100:6.4,
    };

    // ─── pure helpers ─────────────────────────────────────────────────────────
    const fmt  = v => '$' + Math.round(v).toLocaleString();
    const fmtK = v => {
      const a = Math.abs(v), s = v < 0 ? '-' : '';
      if (a >= 1e6)  return s + '$' + (a / 1e6).toFixed(1) + 'M';
      if (a >= 1000) return s + '$' + Math.round(a / 1000) + 'K';
      return s + '$' + Math.round(a);
    };
    const rmdFactor = age => age < 73 ? null : (RMD_FACTORS[Math.min(age, 100)] || 6.0);

    // ─── core computation ─────────────────────────────────────────────────────
    function compute(pv, r, acc, liq, t, td, w, outsideTax, rmdMode, startAge) {
      const rothStart     = outsideTax ? pv : pv * (1 - t);
      const taxPaid       = pv * t;
      const yr0TradWealth = pv * (1 - td);
      const yr0RothWealth = rothStart - (outsideTax ? taxPaid : 0);
      const yr0Adv        = Math.round(yr0RothWealth - yr0TradWealth);

      const rows = [];
      let tradCV = pv, rothCV = rothStart, cumTradAtw = 0, cumRothW = 0;
      const chartLabels    = ['Yr 0'];
      const chartTradCV    = [Math.round(pv)];
      const chartTradTotal = [Math.round(yr0TradWealth)];
      const chartRothTotal = [Math.round(yr0RothWealth)];

      for (let i = 1; i <= liq; i++) {
        const isLiq = i === liq, inDist = i > acc, age = startAge + i, boyCV = tradCV;
        tradCV = tradCV * (1 + r);
        rothCV = rothCV * (1 + r);
        let tradWd = 0, rothWd = 0, isRmd = false;

        if (isLiq) {
          tradWd = tradCV; rothWd = rothCV; tradCV = 0; rothCV = 0;
        } else {
          const volWd = inDist ? tradCV * w : 0;
          if (rmdMode) {
            const factor = rmdFactor(age);
            if (factor !== null) {
              const rmdAmt = boyCV / factor;
              if (rmdAmt > volWd) { tradWd = rmdAmt; isRmd = true; }
              else tradWd = volWd;
            } else tradWd = volWd;
          } else tradWd = volWd;
          rothWd  = inDist ? rothCV * w : 0;
          tradCV -= tradWd;
          rothCV -= rothWd;
        }

        const tradTax         = tradWd * td;
        const tradAftTax      = tradWd * (1 - td);
        cumTradAtw           += tradAftTax;
        cumRothW             += rothWd;
        const tradTotalWealth = cumTradAtw + tradCV * (1 - td);
        const rothTotalWealth = cumRothW + rothCV - (outsideTax ? taxPaid : 0);
        const advantage       = Math.round(rothTotalWealth - tradTotalWealth);
        const inRmd           = isRmd && !inDist;

        rows.push({ i, age, inDist, isLiq, inRmd, tradCV, tradWd, tradTax, tradAftTax,
                    cumTradAtw, rothCV, rothWd, cumRothW, tradTotalWealth, rothTotalWealth,
                    advantage, isRmd });
        chartLabels.push('Yr ' + i);
        chartTradCV.push(Math.round(tradCV + tradWd));
        chartTradTotal.push(Math.round(tradTotalWealth));
        chartRothTotal.push(Math.round(rothTotalWealth));
      }

      const last = rows[rows.length - 1];
      const vLines = [];
      if (w > 0 && acc + 1 <= liq)
        vLines.push({ index: acc + 1, label: 'Distributions begin', color: '#555555' });
      if (rmdMode && startAge < 73) {
        const ry = 73 - startAge;
        if (ry >= 1 && ry <= liq)
          vLines.push({ index: ry, label: 'RMDs begin', color: '#FFBE58' });
      }

      return {
        rows, chartLabels, chartTradCV, chartTradTotal, chartRothTotal,
        last, taxPaid, rothStart, yr0TradWealth, yr0RothWealth, yr0Adv,
        finalAdv: last.advantage, vLines,
      };
    }

    // ─── ledger rows ──────────────────────────────────────────────────────────
    function buildLedgerRows(rows, w, rmdMode) {
      const out = [];
      let lastPhase = null, rmdDividerShown = false;

      rows.forEach((row, idx) => {
        const phase = row.isLiq ? 'liq' : row.inDist ? 'dist' : row.inRmd ? 'rmd' : 'acc';

        if (phase !== lastPhase && !row.isLiq) {
          const label = phase === 'acc' ? 'Accumulation — no withdrawals'
                      : phase === 'rmd' ? 'RMD phase — mandatory distributions begin (age 73+)'
                      :                   'Distribution — annual withdrawals begin';
          const skipDist = phase === 'dist' && w === 0;
          if (!skipDist) {
            out.push(<tr key={`pd-${idx}`} className="phase-divider"><td colSpan={10}>{label}</td></tr>);
            if (phase === 'rmd') rmdDividerShown = true;
          }
          lastPhase = phase;
        }

        if (rmdMode && row.isRmd && !rmdDividerShown && phase === 'dist') {
          out.push(<tr key={`rpd-${idx}`} className="phase-divider"><td colSpan={10}>RMD phase — mandatory distributions begin (age 73+)</td></tr>);
          rmdDividerShown = true;
        }

        if (row.isLiq && lastPhase !== 'liq') {
          out.push(<tr key="liq-pd" className="phase-divider"><td colSpan={10}>Liquidation — full surrender</td></tr>);
          lastPhase = 'liq';
        }

        out.push(
          <tr key={`r${row.i}`} className={row.isLiq ? 'row-liq' : ''}>
            <td>Yr {row.i}{rmdMode && <span style={{ fontSize: 10, color: '#888780' }}> age {row.age}</span>}</td>
            <td>{fmt(row.tradCV + row.tradWd)}</td>
            <td>{row.tradWd > 0 ? <>{fmt(row.tradWd)}{row.isRmd && <span className="tag tag-rmd">RMD</span>}</> : '—'}</td>
            <td>{row.tradTax    > 0 ? `(${fmt(row.tradTax)})`  : '—'}</td>
            <td>{row.tradAftTax > 0 ? fmt(row.tradAftTax)      : '—'}</td>
            <td>{fmt(row.rothCV + row.rothWd)}</td>
            <td>{row.rothWd > 0 ? fmt(row.rothWd) : '—'}</td>
            <td>{fmt(row.tradTotalWealth)}</td>
            <td>{fmt(row.rothTotalWealth)}</td>
            <td className={row.advantage >= 0 ? 'adv-pos' : 'adv-neg'}>{fmt(row.advantage)}</td>
          </tr>
        );
      });
      return out;
    }

    // ─── stable format helpers ────────────────────────────────────────────────
    // Defined at module scope so Slider (memoized below) gets stable references
    // and skips re-renders when only unrelated parent state changes.
    const FMT_DOLLAR = v => '$' + Number(v).toLocaleString();
    const FMT_RATE   = v => Number(v).toFixed(1) + '%';
    const FMT_PCT    = v => v + '%';
    const FMT_YEAR   = v => 'Yr ' + v;

    // ─── sub-components ───────────────────────────────────────────────────────
    const ExCard = memo(function ExCard({ icon, title, body }) {
      return (
        <div className="ex-card">
          <div className="ec-head">
            <i className={`ti ${icon}`} aria-hidden="true" />
            <span className="ec-title">{title}</span>
          </div>
          <div className="ec-body">{body}</div>
        </div>
      );
    });

    const Slider = memo(function Slider({ label, min, max, step, value, onChange, format }) {
      return (
        <div className="ctrl">
          <label>{label}</label>
          <input type="range" min={min} max={max} step={step} value={value}
                 onChange={e => onChange(Number(e.target.value))} />
          <span className="val">{format(value)}</span>
        </div>
      );
    });

    const SummaryContent = memo(function SummaryContent({ data, pv, rate, acc, liq, tax, taxd, wd, outsideTax, rmdMode }) {
      const { rows, last, taxPaid, rothStart, yr0RothWealth, finalAdv } = data;
      const breakEvenYr = rows.find(r => r.advantage >= 0)?.i ?? null;
      const yr0TradW    = pv * (1 - taxd / 100);
      const keyYears    = [0];
      for (let y = 5; y < liq; y += 5) keyYears.push(y);
      if (!keyYears.includes(liq)) keyYears.push(liq);

      const tableRows = keyYears.map(y => {
        if (y === 0) return { yr: 0, tradCV: pv, rothCV: rothStart, tradW: yr0TradW, rothW: yr0RothWealth, adv: yr0RothWealth - yr0TradW };
        const row = rows.find(r => r.i === y) || rows[rows.length - 1];
        return { yr: y, tradCV: row.tradCV, rothCV: row.rothCV, tradW: row.tradTotalWealth, rothW: row.rothTotalWealth, adv: row.advantage };
      });

      const rateDiff = Math.round(taxd - tax);
      const args = [];
      args.push({ title: 'Tax-free growth on all distributions', body: `Every dollar withdrawn from the Roth is tax-free. Withdrawals from the traditional IRA are taxed as ordinary income at ${taxd}% — reducing your spendable cash on every distribution for the life of the contract.`, num: `After-tax Roth withdrawals exceed traditional by ${fmt(last.cumRothW - last.cumTradAtw)} over the projection period.`, qual: false });
      if (rateDiff > 0) args.push({ title: 'Tax rate lock-in', body: `Converting now at ${tax}% locks in today's rate. Future distributions from the traditional IRA would be taxed at ${taxd}% — ${rateDiff} points higher. All growth inside the Roth escapes that higher rate entirely.`, num: `${rateDiff}pt rate advantage applied to every future distribution and the full liquidation value.`, qual: false });
      if (outsideTax) args.push({ title: 'Full base compounding (outside tax)', body: `Because the conversion tax of ${fmt(taxPaid)} is paid from outside the contract, the full ${fmt(pv)} compounds inside the Roth tax-free — rather than only ${fmt(pv * (1 - tax / 100))} if the tax were paid from within.`, num: `Full ${fmt(pv)} compounding at ${rate}% tax-free vs. ${fmt(pv * (1 - tax / 100))} in the inside-tax scenario.`, qual: false });
      if (rmdMode) args.push({ title: 'No required minimum distributions', body: 'Traditional IRAs require distributions starting at age 73 — forcing taxable income whether you need it or not. The Roth IRA has no RMDs during your lifetime.', num: 'RMD-forced distributions are shown in the ledger. The Roth avoids all of them.', qual: false });
      args.push({ title: 'Tax diversification and income flexibility', body: `A Roth bucket alongside pre-tax accounts lets you control your taxable income in retirement — drawing from Roth in years when additional income would push you into a higher bracket, trigger Social Security taxation, or increase Medicare premiums.`, num: null, qual: true });
      args.push({ title: 'Estate and legacy benefit', body: `Roth IRA assets pass to beneficiaries tax-free. Inherited traditional IRAs require full distribution within 10 years under current law, with all proceeds taxed as ordinary income to heirs — often at their peak earning years.`, num: null, qual: true });

      const today = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
      return (
        <>
          <div className="summary-header">
            <div>
              <div className="sh-logo"><span className="sh-diamond" /><span className="sh-logo-text">The Annuity Edge</span></div>
              <h2>Roth conversion analysis</h2>
              <div className="sh-sub">Traditional IRA vs. Roth IRA — projected outcomes at liquidation</div>
            </div>
            <div className="sh-right">Prepared {today}<br />For review purposes only</div>
          </div>
          <div className="s-section-label">Your scenario</div>
          <div className="s-metric-grid">
            <div className="s-metric"><div className="sm-label">Starting value</div><div className="sm-val">{fmt(pv)}</div></div>
            <div className="s-metric"><div className="sm-label">Growth rate</div><div className="sm-val">{rate}%</div><div className="sm-sub">annual crediting rate</div></div>
            <div className="s-metric"><div className="sm-label">Conversion tax</div><div className="sm-val">{fmt(taxPaid)}</div><div className="sm-sub">{outsideTax ? 'paid from outside contract' : `at ${tax}%, from contract`}</div></div>
            <div className="s-metric"><div className="sm-label">Withdrawals begin</div><div className="sm-val">Year {acc}</div><div className="sm-sub">at {Number(wd).toFixed(1)}% annually</div></div>
            <div className="s-metric"><div className="sm-label">Liquidation year</div><div className="sm-val">Year {liq}</div><div className="sm-sub">full surrender</div></div>
            <div className="s-metric"><div className="sm-label">Roth break-even</div><div className="sm-val">{breakEvenYr !== null ? `Year ${breakEvenYr}` : 'Beyond projection'}</div><div className="sm-sub">first year Roth leads</div></div>
            <div className="s-metric hero"><div><div className="sm-label">{finalAdv >= 0 ? 'Roth net advantage at liquidation' : 'Traditional advantage at liquidation'}</div><div className="sm-sub">Roth {fmt(last.rothTotalWealth)} vs. Traditional {fmt(last.tradTotalWealth)}</div></div><div className="sm-val">{fmt(Math.abs(finalAdv))}</div></div>
          </div>
          <div className="s-section-label">The case for conversion</div>
          <div className="s-args">
            {args.map((a, i) => (
              <div key={i} className={`s-arg${a.qual ? ' qual' : ''}`}>
                <div className="sa-title">{a.title}</div>
                <div className="sa-body">{a.body}</div>
                {a.num && <div className="sa-num">{a.num}</div>}
              </div>
            ))}
          </div>
          <div className="s-section-label">Projection highlights</div>
          <div style={{ overflowX: 'auto' }}>
            <table className="s-table">
              <thead><tr><th>Year</th><th>Trad CV (pre-tax)</th><th>Roth CV (tax-free)</th><th>Traditional total wealth</th><th>Roth total wealth</th><th>Roth advantage</th></tr></thead>
              <tbody>
                {tableRows.map(row => (
                  <tr key={row.yr}>
                    <td>{row.yr === liq ? `Yr ${row.yr} (liquidation)` : `Yr ${row.yr}`}</td>
                    <td>{fmt(row.tradCV)}</td><td>{fmt(row.rothCV)}</td>
                    <td>{fmt(row.tradW)}</td><td>{fmt(row.rothW)}</td>
                    <td className={row.adv >= 0 ? 's-adv-pos' : 's-adv-neg'}>{fmt(row.adv)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="s-disclosure">This analysis is for illustrative purposes only and does not constitute tax, legal, or investment advice. Actual results will vary based on future tax rates, crediting rates, and individual circumstances. Tax treatment assumes all Roth IRA distributions are qualified (account held 5+ years, owner age 59½ or older). Required minimum distribution amounts are estimates based on the IRS Uniform Lifetime Table and prior year-end balances. Clients should consult a qualified tax advisor before making conversion decisions.</div>
          <div className="s-footer"><span className="s-footer-diamond" /><span className="s-footer-text">The Annuity Edge — theannuityedge.com</span></div>
        </>
      );
    });

    // ─── main component ───────────────────────────────────────────────────────
    function RothConversionCalculator() {
      const [pv,         setPv]         = useState(100000);
      const [rate,       setRate]       = useState(5);
      const [acc,        setAcc]        = useState(1);
      const [liq,        setLiq]        = useState(15);
      const [tax,        setTax]        = useState(24);
      const [taxd,       setTaxd]       = useState(24);
      const [wd,         setWd]         = useState(0);
      const [outsideTax, setOutsideTax] = useState(false);
      const [rmdMode,    setRmdMode]    = useState(false);
      const [startAge,   setStartAge]   = useState(65);
      const [showExp,    setShowExp]    = useState(false);
      const [showSum,    setShowSum]    = useState(false);

      const effectiveLiq = Math.max(liq, acc + 1);

      const data = useMemo(
        () => compute(pv, rate / 100, acc, effectiveLiq, tax / 100, taxd / 100, wd / 100, outsideTax, rmdMode, startAge),
        [pv, rate, acc, effectiveLiq, tax, taxd, wd, outsideTax, rmdMode, startAge]
      );

      const chartRef     = useRef(null);
      const chartInstRef = useRef(null);

      useEffect(() => {
        if (!chartRef.current) return;
        if (chartInstRef.current) { chartInstRef.current.destroy(); chartInstRef.current = null; }
        const { chartLabels, chartTradCV, chartTradTotal, chartRothTotal, vLines } = data;
        const vLinePlugin = {
          id: 'taeVLines',
          afterDraw(chart) {
            const { ctx, chartArea: { top, bottom }, scales: { x } } = chart;
            vLines.forEach(({ index, label, color }) => {
              const px = x.getPixelForValue(index);
              ctx.save();
              ctx.beginPath(); ctx.setLineDash([4, 3]);
              ctx.strokeStyle = color; ctx.lineWidth = 1.5;
              ctx.moveTo(px, top); ctx.lineTo(px, bottom); ctx.stroke();
              ctx.setLineDash([]);
              ctx.fillStyle = color; ctx.font = '600 10px "Source Sans 3", sans-serif';
              ctx.textAlign = 'left'; ctx.textBaseline = 'top';
              ctx.fillText(label, px + 4, top + 4);
              ctx.restore();
            });
          },
        };
        chartInstRef.current = new Chart(chartRef.current, {
          type: 'line',
          data: { labels: chartLabels, datasets: [
            { label: 'Traditional CV (gross)',          data: chartTradCV,    borderColor: '#aaaaaa', borderDash: [5,4], borderWidth: 1.5, pointRadius: 0, tension: 0.3, fill: false },
            { label: 'Traditional total wealth',        data: chartTradTotal, borderColor: '#555555', borderWidth: 2,   pointRadius: 0, tension: 0.3, fill: false },
            { label: 'Roth total wealth',               data: chartRothTotal, borderColor: '#002956', borderWidth: 2.5, pointRadius: 0, tension: 0.3, fill: false },
          ]},
          plugins: [vLinePlugin],
          options: {
            responsive: true, maintainAspectRatio: false,
            layout: { padding: { right: 20 } },
            interaction: { mode: 'index', intersect: false },
            plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ' ' + ctx.dataset.label + ': ' + fmt(ctx.parsed.y) } } },
            scales: {
              x: { grid: { color: 'rgba(0,0,0,0.06)' }, ticks: { color: '#888', font: { size: 11 }, maxTicksLimit: 14, autoSkip: true } },
              y: { grid: { color: 'rgba(0,0,0,0.06)' }, ticks: { color: '#888', font: { size: 11 }, callback: v => fmtK(v) } },
            },
          },
        });
        return () => { if (chartInstRef.current) { chartInstRef.current.destroy(); chartInstRef.current = null; } };
      }, [data]);

      const { rows, last, taxPaid, rothStart, yr0TradWealth, yr0RothWealth, yr0Adv, finalAdv } = data;
      const ledgerRows = buildLedgerRows(rows, wd / 100, rmdMode);
      const rateDiff   = Math.round(taxd - tax);
      const rateNote   = rateDiff > 0
        ? `Distribution rate is <strong>${rateDiff}pts higher</strong> than conversion rate — amplifies the Roth advantage.`
        : rateDiff < 0
        ? `Distribution rate is <strong>${Math.abs(rateDiff)}pts lower</strong> than conversion rate — reduces the Roth advantage.`
        : `Rates are equal — Roth advantage driven by tax-free compounding on CV and withdrawal tax drag${rmdMode ? ', plus RMD avoidance' : ''}.`;
      const noteHtml = `<strong>Conversion tax is a Roth outlay</strong> — ${outsideTax ? `paid from outside funds (${fmt(taxPaid)}), so Roth contract starts at the full ${fmt(pv)} but that ${fmt(taxPaid)} is deducted from Roth total wealth in every row. Both accounts start at equal net wealth of ${fmt(yr0RothWealth)}. The Roth advantage over time comes purely from ${fmt(pv)} compounding tax-free instead of ${fmt(rothStart)}.` : `deducted from the contract, so Roth starts at ${fmt(rothStart)} vs. ${fmt(pv)} for the traditional.`} Traditional CV is pre-tax throughout. <strong>Total wealth</strong> = cumulative after-tax cash received + remaining CV (traditional discounted at ${taxd}% distribution rate; Roth net of external tax outlay). At <strong>Yr ${effectiveLiq} liquidation</strong>, remaining CV is fully surrendered — traditional pays tax, Roth is tax-free. ${rateNote}`;

      return (
        <>
          <div id="tae-roth-calc">
            <div className="tae-container">
              <div className="tae-header">
                <div className="tae-logo"><img src="https://theannuityedge.com/wp-content/themes/lifeproductreview/images/color.png" alt="The Annuity Edge" /></div>
                <div className="tae-badge">Calculator tool</div>
              </div>
              <h1>Roth conversion calculator</h1>
              <p className="subtitle">Year-by-year ledger — traditional IRA vs. Roth IRA after-tax outcomes</p>

              <div className="tool-disclaimer">
                <p>This tool models the year-by-year comparison between a traditional IRA annuity and a Roth IRA annuity under identical growth assumptions, with tax rates set independently for the conversion year and distribution years. It is a <strong>planning tool, not an illustration</strong> — designed to show the structural logic of a conversion at stated rate assumptions before any product recommendation is made.</p>
                <p>It does not model year-to-year variation in tax rates, IRMAA thresholds, state income tax, the pro-rata rule, the widow's penalty, or the specific product features of any annuity contract. Those variables require a tax professional and a product-specific illustration.</p>
              </div>

              <div className={`explainer-toggle${showExp ? ' open' : ''}`} onClick={() => setShowExp(v => !v)}>
                <span className="et-label">Why consider a Roth conversion?</span>
                <i className="ti ti-chevron-down et-chevron" aria-hidden="true" />
              </div>
              {showExp && (
                <div className="explainer-grid">
                  <ExCard icon="ti-receipt-off"            title="Tax-free distributions"     body="All Roth withdrawals are tax-free once the account qualifies. Traditional IRA distributions are taxed as ordinary income at your rate in the year taken — reducing every dollar of spendable income." />
                  <ExCard icon="ti-calendar-off"           title="No required distributions"  body="Roth IRAs have no required minimum distributions during the owner's lifetime. Traditional IRAs force taxable income starting at age 73 — whether you need the money or not — potentially pushing you into a higher bracket." />
                  <ExCard icon="ti-lock"                   title="Lock in today's tax rate"   body="Converting now pays tax at today's known rate on your current balance. If your tax rate rises — through legislation or higher retirement income — every dollar of future growth inside the Roth is permanently protected." />
                  <ExCard icon="ti-trending-up"            title="Full base compounding"      body="Paying conversion tax from outside the contract puts 100% of your contract value to work tax-free. More dollars compounding at the same rate — for the full projection period — generates meaningfully more tax-free wealth over time." />
                  <ExCard icon="ti-building-bank"          title="Estate and legacy planning" body="Roth assets pass to beneficiaries tax-free. Inherited traditional IRAs require full distribution within 10 years under current law — taxed as ordinary income to heirs, often at their peak earning years." />

    // ─── dynamic iframe height ────────────────────────────────────────────────
    (function () {
      let lastH = 0, timer;
      function reportHeight() {
        clearTimeout(timer);
        timer = setTimeout(function () {
          const el = document.getElementById('tae-roth-calc');
          const h = el
            ? Math.ceil(el.getBoundingClientRect().bottom + window.scrollY) + 32
            : Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
          if (h !== lastH) {
            lastH = h;
            window.parent.postMessage({ type: 'rothCalcHeight', height: h }, '*');
          }
        }, 80);
      }
      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(reportHeight).observe(document.getElementById('root') || document.body);
      }
      window.addEventListener('resize', reportHeight);
      window.addEventListener('load', reportHeight);
      // Re-send height when parent asks (e.g. after WP layout changes)
      window.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'rothCalcPing') { lastH = 0; reportHeight(); }
      });
      setTimeout(reportHeight, 400);
    })();
